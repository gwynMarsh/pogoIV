      const totalDef = base[1] + defIV;
      const totalSta = base[2] + hpIV;

      const targetCPM = Math.sqrt((10 * cp) / (totalAtk * Math.sqrt(totalDef) * Math.sqrt(totalSta)));

      let closestLevel = 1.0;
      let minDiff = Infinity;
      for (const [lvl, cpm] of Object.entries(cpmTable)) {
        const diff = Math.abs(targetCPM - cpm);
        if (diff < minDiff) {
          minDiff = diff;
          closestLevel = lvl;
        }
      }

      resSub.innerText = `Level ${closestLevel} (${ivSum}/45 IV)`;
    }
  </script>
</head>
<body>
  <h2>Pokémon Evaluator</h2>
  <div class="input-group">
    <input id="name" placeholder="Pokémon Name" autocapitalize="off" autocorrect="off" spellcheck="false">
